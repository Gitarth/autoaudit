# autoaudit's own Opengrep/Semgrep taint rules for server-side JavaScript and
# TypeScript (Express, Koa, Fastify, Next.js route handlers, Node core APIs).
# Written for this project.
rules:
  - id: autoaudit-js-sqli
    mode: taint
    languages: [javascript, typescript]
    severity: ERROR
    message: User-controlled data reaches a SQL statement.
    metadata: {cwe: ["CWE-89: SQL Injection"], category: security}
    pattern-sources: &sources
      - patterns:
          - pattern-either:
              - pattern: $REQ.query
              - pattern: $REQ.body
              - pattern: $REQ.params
              - pattern: $REQ.headers
              - pattern: $REQ.cookies
              - pattern: $REQ.signedCookies
              - pattern: $REQ.url
              - pattern: $REQ.originalUrl
              - pattern: $REQ.path
              - pattern: $REQ.files
              - pattern: $REQ.file
              - pattern: $REQ.get(...)
              - pattern: $REQ.header(...)
              - pattern: $REQ.param(...)
              - pattern: $REQ.request.body
              - pattern: $REQ.request.query
              - pattern: await $REQ.json()
              - pattern: await $REQ.text()
              - pattern: await $REQ.formData()
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(req|request|ctx|context|_req|httpRequest)$
      - pattern: $URL.searchParams.get(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $DB.query($Q, ...)
              - pattern: $DB.execute($Q, ...)
              - pattern: $DB.raw($Q, ...)
              - pattern: $DB.whereRaw($Q, ...)
              - pattern: $DB.orderByRaw($Q, ...)
              - pattern: $DB.havingRaw($Q, ...)
              - pattern: $DB.$queryRawUnsafe($Q, ...)
              - pattern: $DB.$executeRawUnsafe($Q, ...)
              - pattern: $SEQ.query($Q, ...)
              - pattern: $DB.prepare($Q, ...)
          - focus-metavariable: $Q
    pattern-sanitizers:
      - pattern-either:
          - pattern: parseInt(...)
          - pattern: Number(...)
          - pattern: $DB.escape(...)
          - pattern: mysql.escape(...)
          - pattern: SqlString.escape(...)
          - pattern: pgFormat(...)

  - id: autoaudit-js-cmdi
    mode: taint
    languages: [javascript, typescript]
    severity: ERROR
    message: User-controlled data reaches an OS command.
    metadata: {cwe: ["CWE-78: OS Command Injection"], category: security}
    pattern-sources: *sources
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $CP.exec($C, ...)
              - pattern: $CP.execSync($C, ...)
              - pattern: exec($C, ...)
              - pattern: execSync($C, ...)
              - pattern: '$CP.spawn($C, ..., {..., shell: true, ...})'
              - pattern: 'spawn($C, ..., {..., shell: true, ...})'
              - pattern: '$CP.spawnSync($C, ..., {..., shell: true, ...})'
              - pattern: execa.command($C, ...)
              - pattern: execaCommand($C, ...)
              - pattern: shell.exec($C, ...)
          - focus-metavariable: $C
    pattern-sanitizers:
      - pattern-either:
          - pattern: shellescape(...)
          - pattern: shellQuote.quote(...)
          - pattern: quote(...)

  - id: autoaudit-js-path-traversal
    mode: taint
    languages: [javascript, typescript]
    severity: ERROR
    message: User-controlled data selects a file path.
    metadata: {cwe: ["CWE-22: Path Traversal"], category: security}
    pattern-sources: *sources
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $FS.readFile($P, ...)
              - pattern: $FS.readFileSync($P, ...)
              - pattern: $FS.writeFile($P, ...)
              - pattern: $FS.writeFileSync($P, ...)
              - pattern: $FS.appendFile($P, ...)
              - pattern: $FS.createReadStream($P, ...)
              - pattern: $FS.createWriteStream($P, ...)
              - pattern: $FS.unlink($P, ...)
              - pattern: $FS.unlinkSync($P, ...)
              - pattern: $FS.rm($P, ...)
              - pattern: $FS.rmSync($P, ...)
              - pattern: $FS.readdir($P, ...)
              - pattern: $FS.readdirSync($P, ...)
              - pattern: $FS.open($P, ...)
              - pattern: $FS.rename($P, ...)
              - pattern: $FS.copyFile($P, ...)
              - pattern: $FS.stat($P, ...)
              - pattern: $RES.sendFile($P)
              - pattern: $RES.download($P, ...)
          - focus-metavariable: $P
    pattern-sanitizers:
      - pattern-either:
          - pattern: path.basename(...)
          - pattern: basename(...)
          - pattern: sanitizeFilename(...)
          - pattern: sanitize(...)

  - id: autoaudit-js-xss
    mode: taint
    languages: [javascript, typescript]
    severity: WARNING
    message: User-controlled data is written into an HTML response without escaping.
    metadata: {cwe: ["CWE-79: Cross-site Scripting"], category: security}
    pattern-sources: *sources
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $RES.send($X)
              - pattern: $RES.write($X)
              - pattern: $RES.end($X)
              - pattern: $CTX.body = $X
              - pattern: new Response($X, ...)
          - focus-metavariable: $X
    pattern-sanitizers:
      - pattern-either:
          - pattern: escapeHtml(...)
          - pattern: escape(...)
          - pattern: he.encode(...)
          - pattern: he.escape(...)
          - pattern: validator.escape(...)
          - pattern: DOMPurify.sanitize(...)
          - pattern: sanitizeHtml(...)
          - pattern: xss(...)
          - pattern: encodeURIComponent(...)
          - pattern: JSON.stringify(...)
          - pattern: parseInt(...)
          - pattern: Number(...)

  - id: autoaudit-js-code-injection
    mode: taint
    languages: [javascript, typescript]
    severity: ERROR
    message: User-controlled data is evaluated as code.
    metadata: {cwe: ["CWE-94: Code Injection"], category: security}
    pattern-sources: *sources
    pattern-sinks:
      - pattern-either:
          - pattern: eval(...)
          - pattern: new Function(...)
          - pattern: Function(...)
          - pattern: $VM.runInNewContext(...)
          - pattern: $VM.runInThisContext(...)
          - pattern: $VM.runInContext(...)
          - pattern: new $VM.Script(...)
          - pattern: setTimeout($S, ...)
          - pattern: setInterval($S, ...)
          - pattern: require($M)
          - pattern: import($M)

  - id: autoaudit-js-ssrf
    mode: taint
    languages: [javascript, typescript]
    severity: WARNING
    message: User-controlled data selects the URL of a server-side request.
    metadata: {cwe: ["CWE-918: Server-Side Request Forgery"], category: security}
    pattern-sources: *sources
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: fetch($U, ...)
              - pattern: axios($U, ...)
              - pattern: axios.$M($U, ...)
              - patterns:
                  - pattern-either:
                      - pattern: $AX.get($U, ...)
                      - pattern: $AX.post($U, ...)
                      - pattern: $AX.request($U, ...)
                  - metavariable-regex:
                      metavariable: $AX
                      regex: (?i)(axios|http|client|fetcher|instance|api|request)
              - pattern: got($U, ...)
              - pattern: got.$M($U, ...)
              - pattern: request($U, ...)
              - pattern: needle.$M($U, ...)
              - pattern: http.get($U, ...)
              - pattern: https.get($U, ...)
              - pattern: http.request($U, ...)
              - pattern: https.request($U, ...)
          - focus-metavariable: $U

  # Library mode: an exported function's parameters are attacker-controlled
  # (how most npm advisories are scored). Separate rule ids, so triage can tell
  # library findings from request-handler findings.
  - id: autoaudit-js-lib-cmdi
    mode: taint
    languages: [javascript, typescript]
    severity: WARNING
    message: A parameter of an exported function reaches an OS command.
    metadata: {cwe: ["CWE-78: OS Command Injection"], category: security}
    pattern-sources: &lib_sources
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  module.exports.$F = function (..., $P, ...) { ... }
              - pattern-inside: |
                  exports.$F = function (..., $P, ...) { ... }
              - pattern-inside: |
                  module.exports = function (..., $P, ...) { ... }
              - pattern-inside: |
                  export function $F(..., $P, ...) { ... }
              - pattern-inside: |
                  export async function $F(..., $P, ...) { ... }
              - pattern-inside: |
                  export default function $F(..., $P, ...) { ... }
          - pattern: $P
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $CP.exec($C, ...)
              - pattern: $CP.execSync($C, ...)
              - pattern: exec($C, ...)
              - pattern: execSync($C, ...)
              - pattern: '$CP.spawn($C, ..., {..., shell: true, ...})'
              - pattern: 'spawn($C, ..., {..., shell: true, ...})'
          - focus-metavariable: $C
    pattern-sanitizers:
      - pattern-either:
          - pattern: shellescape(...)
          - pattern: shellQuote.quote(...)

  - id: autoaudit-js-lib-code-injection
    mode: taint
    languages: [javascript, typescript]
    severity: WARNING
    message: A parameter of an exported function is evaluated as code.
    metadata: {cwe: ["CWE-94: Code Injection"], category: security}
    pattern-sources: *lib_sources
    pattern-sinks:
      - pattern-either:
          - pattern: eval(...)
          - pattern: new Function(...)
          - pattern: Function(...)
          - pattern: $VM.runInNewContext(...)
          - pattern: $VM.runInThisContext(...)
          - pattern: new $VM.Script(...)

  - id: autoaudit-js-lib-path-traversal
    mode: taint
    languages: [javascript, typescript]
    severity: INFO
    message: A parameter of an exported function selects a file path.
    metadata: {cwe: ["CWE-22: Path Traversal"], category: security}
    pattern-sources: *lib_sources
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $FS.readFile($P, ...)
              - pattern: $FS.readFileSync($P, ...)
              - pattern: $FS.writeFile($P, ...)
              - pattern: $FS.writeFileSync($P, ...)
              - pattern: $FS.createReadStream($P, ...)
              - pattern: $FS.createWriteStream($P, ...)
              - pattern: $FS.unlink($P, ...)
          - focus-metavariable: $P
    pattern-sanitizers:
      - pattern: path.basename(...)
